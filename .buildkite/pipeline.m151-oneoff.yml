# One-off Buildkite pipeline to build the Replay Chromium **m151** branch (macOS arm64)
# and produce a DOWNLOADABLE binary. This is the iterate-on-build-errors loop driver.
#
# HOW TO RUN (one-off, no GitHub Actions):
#   In Buildkite, create a build on this repo with branch=m151 and this pipeline file
#   (or: `buildkite-agent pipeline upload .buildkite/pipeline.m151-oneoff.yml`).
#
# PREREQUISITES:
#   1. A macOS **arm64** Buildkite agent with: depot_tools on PATH, the dep subrepos already
#      checked out under the chromium tree (v8, third_party/{skia,webrtc,boringssl/src}), and a
#      backend checkout at RECORD_REPLAY_BACKEND_DIR. SSH deploy access to the replayio forks.
#   2. The driver is built locally on the agent here (no S3 publish needed) and embedded via
#      REPLAY_LOCAL_DRIVER_DIR — backend is synced to REPLAY_BACKEND_REV (the m151-driver commit)
#      by update-all-repos. See M151_BUILD_WIRING.md.
#
# Self-contained build.js path (driver-embed -> gn gen -> autoninja chrome -> package). arm64.

env:
  FORCE_COLOR: 1
  GIT_TERMINAL_PROMPT: 0

steps:
  - label: "🍎 Build Replay Chromium (m151, macOS arm64) + upload"
    key: "build-m151-macos-arm64"
    timeout_in_minutes: 480
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            BUILDEVENT_APIKEY: honeycomb-api-key
            BUILDEVENT_BUILDKITE_API_TOKEN: buildkite-api-token-honeycomb-build-events
    commands:
      - "git fetch --all"
      - "git reset --hard origin/m151"
      # Ensure each dep subrepo has the replayio fork as a remote so update-all-repos'
      # `git fetch --all` can retrieve the fork-tip SHAs pinned in DEPS. syncRepo does
      # NOT add remotes. (idempotent; webrtc lives in the separate webrtc-blamy repo.)
      - "git -C v8 remote add replayio https://github.com/replayio/chromium-v8.git || true"
      - "git -C third_party/skia remote add replayio https://github.com/replayio/chromium-skia.git || true"
      - "git -C third_party/boringssl/src remote add replayio https://github.com/replayio/boringssl.git || true"
      - "git -C third_party/webrtc remote add webrtc-blamy https://github.com/replayio/webrtc-blamy.git || true"
      # Sync dep forks (v8/skia/webrtc/boringssl) to DEPS-pinned fork tips + sync the backend
      # checkout to REPLAY_BACKEND_REV (the m151-driver commit).
      - "node replay_build_scripts/update-all-repos.mjs"
      - "pushd replay_build_scripts && npm ci && popd"
      # Build the M151 recordreplay driver on the agent (arm64) and embed it locally via
      # REPLAY_LOCAL_DRIVER_DIR. LinkerVersion.cpp is normally generated by the backend's
      # build-recorder; generate the minimal form + metadata json here.
      - "mkdir -p $RECORD_REPLAY_BACKEND_DIR/out"
      - "printf '#include \"recording/Recording.h\"\\nconst char recordreplay::gLinkerVersion[] = \"macOS-recordreplay-arm-m151\";\\n' > $RECORD_REPLAY_BACKEND_DIR/out/LinkerVersion.cpp"
      - "make -C $RECORD_REPLAY_BACKEND_DIR/src/cpp driver PLATFORM=macOS ARM=1 CXX=clang++ -j8"
      - "printf '{\"revision\":\"f8c07e2ce22cbadd368f04b28c0f529c2f6fee5b\",\"date\":\"20260607\"}\\n' > $RECORD_REPLAY_BACKEND_DIR/out/macOS-recordreplay-arm.json"
      # Seed gn args (build.js runs a bare `gn gen`, nothing copies *_args.gn). arm64 ->
      # out/Release-ARM. Force use_remoteexec=false: local build, no EngFlow RBE/reclient
      # (see the reclient gap in M151_BUILD_WIRING.md).
      - "mkdir -p out/Release-ARM"
      - "cp replay_build_scripts/mac_arm64_args.gn out/Release-ARM/args.gn"
      - "echo 'use_remoteexec = false' >> out/Release-ARM/args.gn"
      # Embed driver into base/record_replay_driver.cc, gn gen out/Release-ARM, autoninja chrome.
      - "node build.js"
      # Package Chromium.app -> .dmg/.tar.xz, upload to dev bucket, annotate the download URL.
      - "node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      RECORD_REPLAY_BACKEND_DIR: /Users/buildkite/chromium/backend
      LOCAL_DEVELOPER_BUILD_EXTENSION: "m151-oneoff"
      REPLAY_BUILD_ARM: "true"
      REPLAY_LOCAL_DRIVER_DIR: /Users/buildkite/chromium/backend/out
    agents:
      - "os=macos"
      - "queue=runtime"
    artifact_paths:
      - "build_id/macOS/**"
