env:
  FORCE_COLOR: 1
  GIT_TERMINAL_PROMPT: 0
steps:
  - label: Build chromium - Mac (x86)
    key: build-chromium-mac-x86_64
    timeout_in_minutes: 60
    plugins:
      - thedyrt/skip-checkout#v0.1.1:
          cd: /Users/administrator/chromium/src
    command: >-
      git fetch --all && git reset --hard origin/$BUILDKITE_BRANCH && node
      replay_build_scripts/update-all-repos.mjs && node buildMac.mjs &&  node
      replay_build_scripts/upload_build_artifacts.mjs
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
      RECORD_REPLAY_BACKEND_DIR: /Users/administrator/chromium/backend
      DRIVER_REVISION: e74c574835f3
    agents:
      - runtimeType=chromiumbuild
      - os=macos
      - queue=runtime
    artifact_paths:
      - build_id/macOS/x86_64/**
    depends_on:
      - build-driver-linker
      - build-driver-linker
  - label: Build chromium - Mac (arm64)
    key: build-chromium-mac-arm64
    timeout_in_minutes: 60
    plugins:
      - thedyrt/skip-checkout#v0.1.1:
          cd: /Users/administrator/chromium/src
    command: >-
      git fetch --all && git reset --hard origin/$BUILDKITE_BRANCH && node
      replay_build_scripts/update-all-repos.mjs && node buildMac.mjs &&  node
      replay_build_scripts/upload_build_artifacts.mjs
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
      REPLAY_BUILD_ARM: true
      RECORD_REPLAY_BACKEND_DIR: /Users/administrator/chromium/backend
      DRIVER_REVISION: e74c574835f3
    agents:
      - runtimeType=chromiumbuild
      - os=macos
      - queue=runtime
    artifact_paths:
      - build_id/macOS/arm64/**
    depends_on:
      - build-driver-linker
      - build-driver-linker
  - trigger: testing-runtime-e2e
    label: ':hammer: Trigger Runtime Tests'
    depends_on:
      - build-chromium-mac-x86_64
      - build-chromium-mac-arm64
      - build-driver-linker
    build:
      branch: >-
        dominik/run-2814-buildkite-hackfix-to-run-custom-scripts-on-a-single-target
    env:
      DRIVER_REVISION: e74c574835f3
  - trigger: build-driver-linker
    key: build-driver-linker
    label: Build Driver/Linker
