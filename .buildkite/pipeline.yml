          INACTIVE_FILE=$$(awk '/^inactive_file /{print $$2}' /sys/fs/cgroup/memory.stat)
          PROCESSES=$$(for P in /proc/[0-9]*; do
              NAME=$$(tr ' ' '_' < "$$P/comm" 2>/dev/null) || continue
              PSS=$$(awk '/^Pss:/{print $$2}' "$$P/smaps_rollup" 2>/dev/null) || continue
              echo "$$NAME $${PSS:-0}"
            done) || true
          BY_NAME=$$(echo "$$PROCESSES" | awk '{n[$$1]++; s[$$1]+=$$2} END{for (c in n) if (s[c] >= 51200) printf "%s=%dx%d ", c, n[c], s[c]/1024}') || true
          LARGEST=$$(echo "$$PROCESSES" | sort -k2 -nr | awk 'NR <= 8 {printf "%s:%d ", $$1, $$2/1024}') || true
          echo "pod-memory-mb working-set=$$(( (CURRENT - INACTIVE_FILE) / 1048576 )) current=$$(( CURRENT / 1048576 )) | $$BY_NAME| largest: $$LARGEST"
          sleep 10
        done ) &
      npx tsx src/build/buildRuntime.ts test-chromium-recording --build-id "$$BUILD_ID" --filter tests/manual-sessions/chatgpt-1
