  - label: "🔨 Chromium (linux-x86_64)"
    key: "build-chromium-linux-x86_64"
    # depends_on: "preflight-checks"
    timeout_in_minutes: 360
    plugins:
      - thedyrt/skip-checkout#v0.1.1:
          cd: /home/ubuntu/chromium/src
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            BUILDEVENT_APIKEY: honeycomb-api-key
            BUILDEVENT_BUILDKITE_API_TOKEN: buildkite-api-token-buildevents
          file:
            - path: "/home/ubuntu/chromium/engflow.crt"
              secret-id: engflow-certificate
            - path: "/home/ubuntu/chromium/engflow.key"
              secret-id: engflow-key
      - replayio/buildevents#76b6f57: ~
    commands:
      - "be_cmd git-fetch-origin -- git fetch origin"
      - "be_cmd git-reset-branch -- git reset --hard origin/$BUILDKITE_BRANCH"
      - "be_cmd clean-artifacts-dir -- node replay_build_scripts/clean_artifacts.mjs"
      - "be_cmd update-all-repos -- node replay_build_scripts/update-all-repos.mjs"
      - "be_cmd chromium-build -- node buildLinux.mjs"
      - "be_cmd upload-artifacts -- node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      RECORD_REPLAY_BACKEND_DIR: /home/ubuntu/chromium/backend
      RBE_service: simpsonite.cluster.engflow.com:443
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "true"
    # build-runtime=true: shared heavy-build capacity (Node + Chromium).
    # runtimeType=chromiumbuild: host has /home/ubuntu/chromium checkout (skip-checkout).
    agents:
      - "build-runtime=true"
      - "runtimeType=chromiumbuild"
      - "os=linux"
      - "queue=runtime"
    artifact_paths:
      - "build_id/linux/x86_64/**"

  - label: "📝 E2E Tests (linux-x86_64)"
    trigger: "runtime-fe-end-to-end-tests"
    depends_on:
      - "build-chromium-linux-x86_64"
    build:
      env:
        OS: "linux"
        ARCH: "x86_64"
        RECORD_REPLAY_METADATA_SOURCE_COMMIT_TITLE: "${BUILDKITE_MESSAGE}"
        RECORD_REPLAY_METADATA_SOURCE_COMMIT_ID: "${BUILDKITE_COMMIT}"
        RECORD_REPLAY_METADATA_SOURCE_BRANCH: "${BUILDKITE_BRANCH}"
        RECORD_REPLAY_METADATA_SOURCE_MERGE_ID: "${BUILDKITE_PULL_REQUEST}"
        RUNTIME_REPO: "${BUILDKITE_PULL_REQUEST_REPO}"

  # Parallel with E2E: inline chromium-recording (mirrors node test-node).
  # e2e=true: only linux class with Replay Chromium runtime libs (libnss3); can_replay lacks them.
  - label: "📝 Chromium Recording Tests (linux-x86_64)"
    key: "chromium-recording-linux-x86_64"
    depends_on:
      - "build-chromium-linux-x86_64"
    agents:
      - "e2e=true"
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            HASURA_ADMIN_SECRET: "prod/hasura-admin-secret"
            RECORD_REPLAY_API_KEY: "prod/public-api-key"
    env:
      PLAYWRIGHT_HEADLESS: "true"
      CI: "1"
    command: |
      set -euo pipefail
      PIN="$$REPLAY_BACKEND_REV"
      test -n "$$PIN"
      WORKDIR=$$(mktemp -d "/tmp/chromium-recording-$${BUILDKITE_JOB_ID}.XXXXXX")
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      # LinkerZombieLeak: sweep before tests + always after (even on failure).
      "$$BACKEND_DIR/scripts/kill-linker-processes.sh"
      trap '"$$BACKEND_DIR/scripts/kill-linker-processes.sh"; rm -rf "$$WORKDIR"' EXIT
      buildkite-agent artifact download build_id/linux/x86_64/build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id/linux/x86_64/build_id")"
      test -n "$$BUILD_ID"
      cd "$$BACKEND_DIR"
      unset REPLAY_LOCAL_DRIVER_DIR || true
      node --version
      # packageManager pnpm@10.11.0; agents lack global npm write (EACCES).
      npx --yes pnpm@10.11.0 install --frozen-lockfile
      npx tsx src/build/buildChromium.ts test-chromium-recording --build-id "$$BUILD_ID"

