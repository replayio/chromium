# Chromium 157 Replay runtime (rebase/157/*): Linux x86_64, build only.
#
# Uploaded by the `chromium-build` pipeline's settings step, which fetches this
# file by URL for the build's branch. Builds are created on that pipeline
# through the API (branch, commit, env); nothing here is triggered by a push.
#
# The step runs on the agent that builds Chromium 108 for production. What it
# may touch there is fixed in replay_build_scripts/ci/config.sh: one directory
# (~/chromium-checkouts/m157), its own docker image and container names, and
# files of its own in the job workspace, removed when the job ends.
#
# Per-build switches are env of the Buildkite build (replay_build_scripts/ci/job.sh):
#   DRIVER_REVISION, REPLAY_BUILD_MAX_FAILURES (0: keep going, the default;
#   1: stop at the first error), REPLAY_SISO_LOCAL_JOBS, REPLAY_SISO_CONFIG.
# They are deliberately not given defaults in a step `env` here: step env
# overrides build env.
env:
  FORCE_COLOR: 1
  GIT_TERMINAL_PROMPT: 0

steps:
  - label: ":hammer: Chromium 157 (linux-x86_64)"
    key: "build-chromium-157-linux-x86_64"
    # The agent runs one job at a time, so this is also how long a 157 build
    # can keep a 108 build waiting. A build that times out is continued by the
    # next one: the out dir and siso's state stay in the checkout.
    timeout_in_minutes: &timeout 240
    # Below the default (0): a queued 108 build is picked before a queued 157 one.
    priority: -1
    concurrency: 1
    concurrency_group: "chromium-157/linux-x86_64"
    # The plugins and versions master's build step uses, so the agent needs
    # nothing new. No repository checkout: the job works from a ~70 MB clone of
    # replay_build_scripts/ci (bootstrap.sh).
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          # Into the job workspace, under names only this step uses; the
          # command removes them when the job ends, whatever fails.
          file:
            - path: "engflow-m157.crt"
              secret-id: engflow-certificate
            - path: "engflow-m157.key"
              secret-id: engflow-key
    env:
      REPLAY_JOB_TIMEOUT_MINUTES: *timeout
    agents:
      - "build-runtime=true"
      - "runtimeType=chromiumbuild"
      - "os=linux"
      - "queue=runtime"
    # Artifacts are uploaded by job.sh itself, from the checkout's job directory.
    command: |
      set -euo pipefail
      WS="$$PWD"
      trap 'rm -rf "$$WS/engflow-m157.crt" "$$WS/engflow-m157.key" "$$WS/ci-bootstrap-m157.sh" "$$WS/.ci-boot-m157"' EXIT
      # The one thing taken by URL: the script that fetches the rest of this
      # commit's CI scripts. Everything after it is repository content at the
      # commit being built.
      REF="$$BUILDKITE_COMMIT"
      if [ "$$REF" = "HEAD" ]; then REF="$$BUILDKITE_BRANCH"; fi
      curl -fsS "https://raw.githubusercontent.com/replayio/chromium/$$REF/replay_build_scripts/ci/bootstrap.sh" -o ci-bootstrap-m157.sh
      bash ci-bootstrap-m157.sh "$$REF" .ci-boot-m157
      export ENGFLOW_CERT_FILE="$$WS/engflow-m157.crt" ENGFLOW_KEY_FILE="$$WS/engflow-m157.key"
      .ci-boot-m157/replay_build_scripts/ci/job.sh

  # ===========================================================================
  # TEST STEP: none yet (157 is build-only).
  #
  # Add it here, with
  #   depends_on: "build-chromium-157-linux-x86_64"
  # The runtime is a Buildkite artifact of the build step, not an S3 object:
  #   buildkite-agent artifact download "build_id/linux/x86_64/*" .
  # gives build_id and <build id>.tar.xz (replay-chromium/). master's test
  # steps resolve a build id against S3 / static.replay.io, where a 157 build
  # is never uploaded, so they cannot be copied as they are.
  # ===========================================================================
