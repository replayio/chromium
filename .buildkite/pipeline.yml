      CI: "1"
      # The line reporter prints steps only for a terminal.
      PLAYWRIGHT_FORCE_TTY: "1"
      VARIANT: "no-dependency-graph"
      # Diagnostic: the tools run without the dependency graph.
      DISABLE_DEPENDENCY_GRAPH: "1"
    command: |
      set -euo pipefail
      PIN="$$REPLAY_BACKEND_REV"
