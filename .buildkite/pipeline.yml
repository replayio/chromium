# Chromium 157 Replay runtime (rebase/157/*): Linux x86_64 build and one record -> replay test.
#
# Uploaded by the `chromium-build` pipeline's settings step, which fetches this
# file by URL for the build's branch. Builds are created on that pipeline
# through the API (branch, commit, env); nothing here is triggered by a push.
#
# The step runs on the agent that builds Chromium 108 for production. What it
# may touch there is fixed in replay_build_scripts/ci/config.sh: one directory
# (~/chromium-checkouts/m157), its own docker image and container names, and
# files of its own in the job workspace, removed when the job ends.
#
# Per-build switches are env of the Buildkite build (replay_build_scripts/ci/job.sh):
#   DRIVER_REVISION, REPLAY_BUILD_MAX_FAILURES (0: keep going, the default;
#   1: stop at the first error), REPLAY_SISO_LOCAL_JOBS, REPLAY_SISO_CONFIG.
# They are deliberately not given defaults in a step `env` here: step env
# overrides build env.
env:
  FORCE_COLOR: 1
  GIT_TERMINAL_PROMPT: 0

steps:
  - label: ":hammer: Chromium 157 (linux-x86_64)"
    key: "build-chromium-157-linux-x86_64"
    # The agent runs one job at a time, so this is also how long a 157 build
    # can keep a 108 build waiting. A build that times out is continued by the
    # next one: the out dir and siso's state stay in the checkout.
    timeout_in_minutes: &timeout 240
    # Below the default (0): a queued 108 build is picked before a queued 157 one.
    priority: -1
    concurrency: 1
    concurrency_group: "chromium-157/linux-x86_64"
    # The plugins and versions master's build step uses, so the agent needs
    # nothing new. No repository checkout: the job works from a ~70 MB clone of
    # replay_build_scripts/ci (bootstrap.sh).
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          # Into the job workspace, under names only this step uses; the
          # command removes them when the job ends, whatever fails.
          file:
            - path: "engflow-m157.crt"
              secret-id: engflow-certificate
            - path: "engflow-m157.key"
              secret-id: engflow-key
    env:
      REPLAY_JOB_TIMEOUT_MINUTES: *timeout
    agents:
      - "build-runtime=true"
      - "runtimeType=chromiumbuild"
      - "os=linux"
      - "queue=runtime"
    # Artifacts are uploaded by job.sh itself, from the checkout's job directory.
    command: |
      set -euo pipefail
      WS="$$PWD"
      trap 'rm -rf "$$WS/engflow-m157.crt" "$$WS/engflow-m157.key" "$$WS/ci-bootstrap-m157.sh" "$$WS/.ci-boot-m157"' EXIT
      # The one thing taken by URL: the script that fetches the rest of this
      # commit's CI scripts. Everything after it is repository content at the
      # commit being built.
      REF="$$BUILDKITE_COMMIT"
      if [ "$$REF" = "HEAD" ]; then REF="$$BUILDKITE_BRANCH"; fi
      curl -fsS "https://raw.githubusercontent.com/replayio/chromium/$$REF/replay_build_scripts/ci/bootstrap.sh" -o ci-bootstrap-m157.sh
      bash ci-bootstrap-m157.sh "$$REF" .ci-boot-m157
      export ENGFLOW_CERT_FILE="$$WS/engflow-m157.crt" ENGFLOW_KEY_FILE="$$WS/engflow-m157.key"
      .ci-boot-m157/replay_build_scripts/ci/job.sh

  # One record -> replay case of the backend's test/chromium-recording suite,
  # with the runtime the build step made. From master's "Chromium Recording
  # Tests" step; the differences:
  # - the runtime is the build step's Buildkite artifact (a 157 build is never
  #   uploaded to S3 / static.replay.io), handed over as
  #   REPLAY_CHROMIUM_EXECUTABLE_PATH;
  # - one case, not the suite: REPLAY_157_TEST_CASE of the Buildkite build
  #   (default below), a path under test/chromium-recording.
  # REPLAY_BACKEND_REV (env of the Buildkite build) is the backend commit whose
  # driver the runtime embeds and whose linker replays the recording.
  - label: ":memo: Chromium 157 record -> replay (one case)"
    key: "chromium-157-recording-linux-x86_64"
    depends_on: "build-chromium-157-linux-x86_64"
    timeout_in_minutes: 30
    agents:
      - "e2e=true"
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            HASURA_ADMIN_SECRET: "prod/hasura-admin-secret"
            RECORD_REPLAY_API_KEY: "prod/public-api-key"
    env:
      PLAYWRIGHT_HEADLESS: "true"
      CI: "1"
    command: |
      set -euo pipefail
      PIN="$$REPLAY_BACKEND_REV"
      test -n "$$PIN"
      CASE="$${REPLAY_157_TEST_CASE:-tests/evaluate/outbound-fetch}"
      WORKDIR=$$(mktemp -d "/tmp/chromium157-recording-$${BUILDKITE_JOB_ID}.XXXXXX")
      # Short path: unix socket paths under TMPDIR are length-limited.
      TMPDIR=$$(mktemp -d /tmp/c157.XXXXXX)
      export TMPDIR
      trap 'rm -rf "$$WORKDIR" "$$TMPDIR"' EXIT
      export RECORD_REPLAY_DIRECTORY="$$WORKDIR/replay"
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR" "$$RECORD_REPLAY_DIRECTORY" "$$WORKDIR/runtime"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      "$$BACKEND_DIR/scripts/kill-linker-processes.sh"
      trap '"$$BACKEND_DIR/scripts/kill-linker-processes.sh"; rm -rf "$$WORKDIR" "$$TMPDIR"' EXIT
      buildkite-agent artifact download "build_id/linux/x86_64/*" "$$WORKDIR/" --step "build-chromium-157-linux-x86_64"
      BUILD_ID="$$(cat "$$WORKDIR/build_id/linux/x86_64/build_id")"
      test -n "$$BUILD_ID"
      tar -xJf "$$WORKDIR/build_id/linux/x86_64/$$BUILD_ID.tar.xz" -C "$$WORKDIR/runtime"
      export REPLAY_CHROMIUM_EXECUTABLE_PATH="$$WORKDIR/runtime/replay-chromium/chrome"
      export RECORD_REPLAY_ASSETS_DIRECTORY="$$WORKDIR/runtime/replay-chromium/replay-assets"
      test -x "$$REPLAY_CHROMIUM_EXECUTABLE_PATH"
      cd "$$BACKEND_DIR"
      unset REPLAY_LOCAL_DRIVER_DIR || true
      # The agents' Node is older than the backend's: a user-space copy of the
      # pinned backend's .nvmrc version, as master does.
      NODE_VERSION="$$(sed 's/^v//' .nvmrc)"
      test -n "$$NODE_VERSION"
      NODE_PREFIX="$$WORKDIR/node-v$${NODE_VERSION}-linux-x64"
      curl -fsSL "https://nodejs.org/dist/v$${NODE_VERSION}/node-v$${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ -C "$$WORKDIR"
      export PATH="$${NODE_PREFIX}/bin:$$PATH"
      hash -r
      node --version
      npx --yes pnpm@10.11.0 install --frozen-lockfile
      echo "--- record -> replay: $$CASE ($$BUILD_ID)"
      cd test/chromium-recording
      npx playwright test --config=playwright.config.ts "$$CASE"
