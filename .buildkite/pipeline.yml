env:
  FORCE_COLOR: 1
  GIT_TERMINAL_PROMPT: 0

steps:
  - label: "Build chromium - Linux"
    key: "build-chromium-linux-x86_64"
    timeout_in_minutes: 60
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
    command: "cd /home/ubuntu/chromium/src && docker build -t chromium-build-new - < Dockerfile.build && git status && node buildLinux.mjs && node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
    agents:
      - "runtimeType=chromiumbuild"
      - "os=linux"
      - "queue=runtime"
    artifact_paths:
      - "build_id/linux/x86_64/**"
  - label: "Build chromium - Mac (x86)"
    key: "build-chromium-mac-x86_64"
    timeout_in_minutes: 60
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
    command: "cd /Users/administrator/chromium/src && node buildMac.mjs &&  node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
    agents:
      - "runtimeType=chromiumbuild"
      - "os=macos"
      - "queue=runtime"
    artifact_paths:
      - "build_id/macOS/x86_64/**"
  - label: "Build chromium - Mac (arm64)"
    key: "build-chromium-mac-arm64"
    timeout_in_minutes: 60
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
    command: "cd /Users/administrator/chromium/src && node buildMac.mjs &&  node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
      REPLAY_BUILD_ARM: true
    agents:
      - "runtimeType=chromiumbuild"
      - "os=macos"
      - "queue=runtime"
    artifact_paths:
      - "build_id/macOS/arm64/**"
  - label: "Build chromium - Windows"
    key: "build-chromium-windows"
    timeout_in_minutes: 60
    plugins:
      - https://github.com/jazzdan/skip-checkout-buildkite-plugin.git#jazzdan/windows-support: ~
    command: "cd C:\\Users\\Administrator\\chromium\\src && node buildWindows.mjs &&  node replay_build_scripts/upload_build_artifacts.mjs"
    env:
      GOMA_SERVER_HOST: simpsonite.goma.engflow.com
      GOMACTL_USE_PROXY: false
      RECORD_REPLAY_BACKEND_DIR: "C:\\Users\\Administrator\\backend"
    agents:
      - "runtimeType=chromiumbuild"
      - "os=windows"
      - "queue=runtime"
    artifact_paths:
      - "build_id/windows/x86_64/**"
  - trigger: "testing-runtime-e2e"
    label: ":hammer: Trigger Runtime Tests"
    depends_on:
      - "build-chromium-linux-x86_64"
      - "build-chromium-mac-x86_64"
      - "build-chromium-mac-arm64"
  - label: "Metabase Test Suite"
    depends_on: "build-chromium-linux-x86_64"
    command: >
      curl -L -s \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer <secret>" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/replayio-public/metabase/actions/workflows/e2e-tests.yml/dispatches \
        -d '{"ref":"master","inputs":{"chromium-build-id":"<build_id_from_buildkite_path>","folders":"[\"binning\",\"downloads\"]"}}' && \
      curl -L -s \
        -X GET \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer <secret>" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/replayio-public/metabase/actions/runs\?event\=workflow_dispatch | jq -r '.workflow_runs[0].url' >> send-to-buildkite-message?
